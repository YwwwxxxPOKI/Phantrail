<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04141a">
<title>Phantrail</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* =========================================================
   PHANTRAIL 2.0 - Stil
   ========================================================= */
:root{
  --bg:#04141a;
  --cream:#fff6e0;
  --amber:#ffb02e;
  --red:#ff5a5f;
  --cyan:#7fe9ff;
  --mint:#5df2b4;
  --violet:#a98bff;
  --ink:#1a0f00;
  --line:rgba(255,246,224,.16);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;touch-action:none;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}

/* ---------- Ikonlar ---------- */
.ico{
  width:1em;height:1em;display:inline-block;vertical-align:middle;flex:none;
  stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

/* ---------- Cam panel ---------- */
.glass{
  background:linear-gradient(160deg,rgba(255,246,224,.11),rgba(255,246,224,.04));
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid var(--line);
  box-shadow:0 18px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,246,224,.22);
  border-radius:26px;
}

/* ---------- Ekranlar ---------- */
.screen{
  position:fixed;inset:0;z-index:20;display:flex;justify-content:center;
  padding:max(14px,var(--safe-t)) 14px max(14px,var(--safe-b));
  overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  transition:opacity .4s cubic-bezier(.2,.8,.2,1),transform .4s cubic-bezier(.2,.8,.2,1);
}
.panel{width:100%;max-width:420px;padding:22px 20px;margin:auto}
.panel.small{max-width:340px}
.off{opacity:0!important;pointer-events:none!important;transform:scale(.96) translateY(10px)}
.center{text-align:center}
.muted{opacity:.7;font-size:13px;margin:4px 0}
.gold{color:#ffd27a;font-size:14px;font-weight:700;margin:4px 0}

/* Kademeli giris */
.screen:not(.off) .st{
  animation:rise .55s cubic-bezier(.2,.9,.2,1) both;
  animation-delay:calc(var(--i,0)*55ms + 60ms);
}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

/* Basliklar */
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hdr h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1}
.rbtn{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;
  background:rgba(255,246,224,.09);border:1px solid var(--line);
  transition:transform .12s,background .2s;
}
.rbtn:hover{background:rgba(255,246,224,.18)}
.rbtn:active{transform:scale(.92)}

/* ---------- Rozetler (her ikon kendi renginde) ---------- */
.badge{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:23px;color:#fff;
  background:linear-gradient(145deg,var(--c1,#ffc24d),var(--c2,#ff8a1f));
  box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.18);
}
.badge.big{width:68px;height:68px;font-size:34px;border-radius:22px;margin:0 auto 10px}
.b-amber{--c1:#ffc24d;--c2:#ff8a1f}
.b-cyan{--c1:#7fe9ff;--c2:#2a8fd8}
.b-violet{--c1:#b79bff;--c2:#6a4be0}
.b-green{--c1:#7dffc8;--c2:#1fae78}
.b-rose{--c1:#ff9ad5;--c2:#e0407f}
.b-gold{--c1:#ffe36b;--c2:#d99a0c}
.b-slate{--c1:#9aa9c8;--c2:#56648a}
.b-red{--c1:#ff8d90;--c2:#e0383e}
.b-teal{--c1:#5de6d0;--c2:#2a9bd6}

/* ---------- Dugmeler ---------- */
.btn{
  position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:14px 18px;margin-top:10px;border-radius:18px;font-weight:700;font-size:16px;
  background:rgba(255,246,224,.09);border:1px solid var(--line);overflow:hidden;
  transition:transform .12s,background .2s,box-shadow .2s;
}
.btn .ico{font-size:20px}
.btn:hover{background:rgba(255,246,224,.17)}
.btn:active{transform:scale(.97)}
.btn.main{
  background:linear-gradient(180deg,#ffc24d,#ff9a1f);color:var(--ink);border:0;font-size:19px;padding:17px;
  box-shadow:0 8px 30px rgba(255,150,30,.45),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(150,70,0,.35);
  animation:pl 2.4s ease-in-out infinite;
}
.btn.main::after{
  content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite;
}
.btn.main.calm{animation:none}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@keyframes pl{50%{box-shadow:0 8px 46px rgba(255,150,30,.8),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(150,70,0,.35)}}

/* ---------- Ana menu ---------- */
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stats{display:flex;gap:8px}
.stat{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:14px;font-size:13px;font-weight:700;
  background:rgba(0,0,0,.25);border:1px solid var(--line);
}
.stat .ico{font-size:16px}
.stat.shk{animation:shk .4s;border-color:var(--red);color:#ff9a9d}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.logo-wrap{text-align:center;margin:26px 0 8px}
.logo{
  font-size:clamp(40px,12vw,58px);font-weight:800;letter-spacing:-.04em;line-height:1;
  animation:ech 3.2s ease-in-out infinite;
}
@keyframes ech{
  0%,100%{text-shadow:-4px 0 0 rgba(255,90,95,.8),-9px 0 0 rgba(255,90,95,.4),-14px 0 0 rgba(255,90,95,.18)}
  50%{text-shadow:-9px 0 0 rgba(255,90,95,.8),-20px 0 0 rgba(255,90,95,.4),-32px 0 0 rgba(255,90,95,.18)}
}
.tagline{margin:16px 0 0;font-size:14px;opacity:.7}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:14px;
  border-radius:20px;text-align:left;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,246,224,.1),rgba(255,246,224,.03));
  border:1px solid var(--line);transition:transform .15s,border-color .2s;
}
.tile::before{
  content:'';position:absolute;right:-40px;bottom:-60px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,var(--c1),transparent 70%);opacity:.26;transition:opacity .3s;
}
.tile:hover::before{opacity:.5}
.tile:hover{border-color:var(--c1)}
.tile:active{transform:scale(.96)}
.tile b{display:block;font-size:15px}
.tile small{font-size:12px;opacity:.65;font-weight:500}
.t-shop{--c1:#ffc24d;--c2:#ff8a1f}
.t-maps{--c1:#5de6d0;--c2:#2a8fd8}
.t-board{--c1:#ffe36b;--c2:#d99a0c}
.t-set{--c1:#a9b4ff;--c2:#5a5ce0}

/* ---------- Sekmeler ---------- */
.tabs{display:flex;gap:6px;padding:4px;border-radius:16px;background:rgba(0,0,0,.25);margin-bottom:14px}
.tab{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:12px;
  font-weight:700;font-size:13px;opacity:.65;transition:background .2s,opacity .2s;
}
.tab .ico{font-size:17px}
.tab.on{background:linear-gradient(180deg,#ffc24d,#ff9a1f);color:var(--ink);opacity:1}
.tab{min-width:0;font-size:12.5px;gap:5px;padding:10px 4px}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px}

/* Kontrol tanıtımı: eğilen telefon animasyonu */
.demo{position:relative;height:150px;margin:6px auto 10px;display:grid;place-items:center}
.demo .ph{
  position:relative;width:64px;height:112px;border-radius:14px;border:3px solid var(--cream);
  background:linear-gradient(160deg,rgba(255,246,224,.16),rgba(255,246,224,.04));
  box-shadow:0 0 30px rgba(255,176,46,.25);animation:tiltDemo 3.6s ease-in-out infinite;
}
.demo .ph i{
  position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 14px var(--amber);animation:dotDemo 3.6s ease-in-out infinite;
}
@keyframes tiltDemo{0%,100%{transform:rotate(0)}25%{transform:rotate(-22deg)}75%{transform:rotate(22deg)}}
@keyframes dotDemo{0%,100%{transform:translateX(0)}25%{transform:translateX(-18px)}75%{transform:translateX(18px)}}
.cintro p{line-height:1.5}
@media (max-width:380px){.tab .ico{display:none}}

/* ---------- Kartlar ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;
  border-radius:20px;text-align:center;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(255,246,224,.09),rgba(255,246,224,.03));
}
.card.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 28px rgba(255,176,46,.25)}
.card canvas{width:100%;aspect-ratio:1;border-radius:14px;display:block}
.card .nm{font-weight:800;font-size:14px;margin-top:2px}
.card small{font-size:11px;opacity:.6;min-height:28px;line-height:1.3}
.lockb{
  position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;
  background:rgba(0,0,0,.55);font-size:14px;
}
.act{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:13px;
  font-weight:800;font-size:13px;background:linear-gradient(180deg,#ffc24d,#ff9a1f);color:var(--ink);
  box-shadow:0 4px 14px rgba(255,150,30,.3),inset 0 1.5px 0 rgba(255,255,255,.5);transition:transform .12s;
}
.act:active{transform:scale(.95)}
.act .ico{font-size:16px}
.act.own{background:rgba(255,246,224,.12);color:var(--cream);box-shadow:none;border:1px solid var(--line)}
.act.cur{background:rgba(93,242,180,.16);color:#7dffc8;box-shadow:none;border:1px solid rgba(93,242,180,.4);cursor:default}

.urow,.arow,.hrow{
  display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;border-radius:18px;
  border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,246,224,.08),rgba(255,246,224,.02));
}
.urow .act{width:auto;min-width:88px}
.utx{flex:1;min-width:0}
.utx b{display:block;font-size:14px}
.utx small{display:block;font-size:12px;opacity:.65;line-height:1.35;margin-top:2px}
.pips{display:flex;gap:4px;margin-top:8px}
.pips i{width:24px;height:6px;border-radius:4px;background:rgba(255,246,224,.15)}
.pips i.on{background:linear-gradient(90deg,#ffb02e,#ffe08a);box-shadow:0 0 8px rgba(255,176,46,.5)}
.hrow{align-items:flex-start}
.arow.done{border-color:rgba(255,210,74,.45)}
.arow:not(.done){opacity:.7}
.reward{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px;color:#ffd27a}

/* Harita kartlari */
.mcard{
  position:relative;padding:10px;margin-bottom:12px;border-radius:20px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(255,246,224,.09),rgba(255,246,224,.03));
}
.mcard.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 28px rgba(255,176,46,.25)}
.mcard canvas{width:100%;aspect-ratio:5/2;border-radius:14px;display:block}
.mrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.mrow .act{width:auto;min-width:96px}

/* Skorlar */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sbox{padding:10px 4px;border-radius:14px;background:rgba(0,0,0,.22);text-align:center}
.sbox b{display:block;font-size:18px}
.sbox small{font-size:10px;opacity:.65}
.srow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(255,246,224,.08)}
.rank{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;background:rgba(255,246,224,.1)}
.r1{background:linear-gradient(145deg,#ffe36b,#d99a0c);color:#3a2600}
.r2{background:linear-gradient(145deg,#e8eef7,#98a6bd);color:#1d2635}
.r3{background:linear-gradient(145deg,#f0b27a,#b2692f);color:#2b1503}
.sv{flex:1}
.sv b{display:block;font-size:19px}
.sv small{font-size:12px;opacity:.6}
.winb{color:#ffc24d;font-size:20px}

/* Ayarlar */
.set-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,246,224,.08)}
.set-row .badge{width:38px;height:38px;font-size:19px;border-radius:12px}
.set-row .lbl{flex:1;font-weight:600;font-size:14px}
.set-sub{display:flex;align-items:center;gap:12px;margin:18px 0 10px;font-weight:700;font-size:14px}
.set-sub .badge{width:38px;height:38px;font-size:19px;border-radius:12px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:130px;height:6px;border-radius:6px;outline:none;
  background:linear-gradient(90deg,var(--amber) var(--v,50%),rgba(255,246,224,.15) var(--v,50%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--cream);
  border:3px solid var(--amber);box-shadow:0 2px 8px rgba(0,0,0,.4);
}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:var(--cream);border:3px solid var(--amber);
}
.sw{position:relative;width:52px;height:30px;border-radius:20px;background:rgba(255,246,224,.15);transition:background .25s}
.sw::after{
  content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--cream);
  transition:transform .25s cubic-bezier(.3,1.5,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.35);
}
.sw.on{background:var(--amber)}
.sw.on::after{transform:translateX(22px)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 14px;border-radius:14px;
  background:rgba(255,246,224,.08);border:1px solid var(--line);transition:background .2s,border-color .2s;
}
.lang b{font-size:15px}
.lang span{font-size:12px;opacity:.7}
.lang.sel{border-color:var(--amber);background:rgba(255,176,46,.16)}

/* Bitis ekrani */
.ot{font-size:28px;font-weight:800;letter-spacing:-.02em}
.ot.win{color:#ffd27a;text-shadow:0 0 30px rgba(255,176,46,.7)}
.ot.lose{color:#ff9a9d;text-shadow:0 0 30px rgba(255,90,95,.6)}
.stars{display:flex;justify-content:center;gap:8px;margin:10px 0 2px;font-size:46px}
.stars .ico{color:rgba(255,246,224,.15);fill:currentColor}
.stars .ico.on{
  color:#ffc24d;filter:drop-shadow(0 0 12px rgba(255,176,46,.8));
  animation:starPop .6s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--k)*.25s + .5s);
}
@keyframes starPop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.bigscore{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
.earn{
  display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:8px 14px;border-radius:14px;
  background:rgba(255,210,74,.12);border:1px solid rgba(255,210,74,.35);font-weight:800;font-size:14px;color:#ffd27a;
}
.earn .ico{font-size:20px}

/* ---------- HUD ---------- */
#hud{
  position:fixed;top:max(10px,var(--safe-t));left:10px;right:10px;z-index:15;display:flex;justify-content:center;
  pointer-events:none;transition:opacity .35s,transform .35s;
}
#hud.off{transform:translateY(-14px)}
.hud-bar{
  width:100%;max-width:640px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  gap:10px;padding:8px 10px;border-radius:20px;
}
.hbtn{
  pointer-events:auto;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;
  background:rgba(255,246,224,.1);border:1px solid var(--line);transition:transform .12s,background .2s;
}
.hbtn:active{transform:scale(.9)}
.hud-mid{min-width:0}
.hud-score{display:flex;align-items:baseline;gap:8px}
#hs{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1;display:inline-block}
#hs.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.25);color:#ffd27a}}
#hc{font-size:15px;font-weight:800;color:#ffd27a}
#hc.hot{color:#ff9a1f;text-shadow:0 0 12px rgba(255,150,30,.8)}
.hud-lv{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;font-weight:700;color:rgba(255,246,224,.75);white-space:nowrap}
.bar{flex:1;height:7px;border-radius:7px;background:rgba(255,246,224,.12);overflow:hidden}
.bar i{
  display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#ffb02e,#ffe08a);
  box-shadow:0 0 10px rgba(255,176,46,.6);transition:width .3s cubic-bezier(.3,1.4,.5,1);
}
.cbar{height:3px;border-radius:3px;margin-top:5px;background:rgba(255,246,224,.08);overflow:hidden}
.cbar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#ff5a5f,#ffb02e)}
.hud-side{display:flex;align-items:center;gap:6px}
.echo-chip{
  display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:12px;font-weight:800;font-size:14px;
  background:rgba(255,90,95,.14);border:1px solid rgba(255,90,95,.4);color:#ff9a9d;
}
.pip{
  width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;color:#7fe9ff;
  background:rgba(127,233,255,.14);border:1px solid rgba(127,233,255,.45);animation:pipp 1.8s ease-in-out infinite;
}
.pip.hide{display:none}
@keyframes pipp{50%{box-shadow:0 0 14px rgba(127,233,255,.6)}}

/* Banner ve bildirim */
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:30;opacity:0}
#banner b{
  display:block;font-size:clamp(36px,11vw,68px);font-weight:800;letter-spacing:-.03em;
  text-shadow:0 0 30px var(--bc,#ffb02e),0 4px 0 rgba(0,0,0,.35);
}
#banner small{display:block;font-size:15px;opacity:.85;margin-top:6px;font-weight:600}
#banner.go{animation:ban var(--bd,1.6s) cubic-bezier(.2,.9,.2,1) both}
@keyframes ban{
  0%{opacity:0;transform:scale(.5)}
  14%{opacity:1;transform:scale(1.1)}
  24%{transform:scale(1)}
  78%{opacity:1}
  100%{opacity:0;transform:scale(1.15) translateY(-12px)}
}
#toast{
  position:fixed;top:calc(var(--safe-t) + 100px);left:50%;z-index:40;display:flex;align-items:center;gap:12px;
  padding:10px 16px 10px 10px;border-radius:18px;opacity:0;pointer-events:none;transform:translate(-50%,-30px);
  background:rgba(8,28,34,.92);border:1px solid rgba(255,210,74,.5);box-shadow:0 12px 40px rgba(0,0,0,.6);
  max-width:calc(100vw - 24px);
}
#toast b{display:block;font-size:14px}
#toast small{display:block;font-size:12px;opacity:.75}
#toast.show{animation:toast 3.2s cubic-bezier(.2,.9,.2,1) both}
@keyframes toast{
  0%{opacity:0;transform:translate(-50%,-30px)}
  10%,85%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-20px)}
}

/* ---------- Acilis ---------- */
#intro{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:radial-gradient(circle at 50% 45%,rgba(4,20,26,.1),rgba(2,8,11,.9));
  transition:opacity .8s,transform .8s,visibility .8s;
}
#intro.leave{opacity:0;transform:scale(1.18);pointer-events:none;visibility:hidden}
.il{display:flex;font-size:clamp(46px,15vw,96px);font-weight:800;letter-spacing:-.04em;line-height:1}
.il span{
  display:inline-block;opacity:0;animation:letIn .9s cubic-bezier(.2,.9,.2,1) forwards;
  animation-delay:calc(var(--d)*80ms + 300ms);
}
.il.echo{animation:ech 3.2s ease-in-out 1.8s infinite}
@keyframes letIn{
  from{opacity:0;transform:translateY(40px) scale(1.4);filter:blur(14px)}
  to{opacity:1;transform:none;filter:blur(0)}
}
.itag{font-size:15px;opacity:0;animation:fadeUp .8s 1.5s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:.75;transform:none}}
.ifoot{position:relative;width:100%;height:56px;display:grid;place-items:center}
.loader{
  position:absolute;width:min(240px,60vw);height:6px;border-radius:6px;background:rgba(255,246,224,.12);
  overflow:hidden;transition:opacity .5s;
}
.loader i{
  display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--amber),#ffd98a);
  box-shadow:0 0 14px var(--amber);transition:width 1.9s cubic-bezier(.4,.1,.2,1);
}
.tapbtn{
  position:absolute;opacity:0;font-weight:700;font-size:16px;padding:12px 26px;border-radius:30px;
  border:1px solid rgba(255,176,46,.6);background:rgba(255,176,46,.12);color:#ffd27a;transition:opacity .5s;
}
#intro.ready .loader{opacity:0}
#intro.ready .tapbtn{opacity:1;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{box-shadow:0 0 26px rgba(255,176,46,.55);background:rgba(255,176,46,.22)}}

@media (max-width:380px){
  .panel{padding:18px 14px}
  .hud-bar{gap:7px;padding:7px}
  #hs{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

#rot{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#04141a;color:#e8f6fa;font:600 16px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;text-align:center;padding:24px}
#rot.on{display:flex}
#rot i{width:34px;height:58px;border:3px solid #ffb02e;border-radius:8px;animation:rotp 1.8s ease-in-out infinite}
@keyframes rotp{0%,30%{transform:rotate(90deg)}70%,100%{transform:rotate(0)}}
#boon{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;background:rgba(2,10,14,.72);backdrop-filter:blur(6px);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color:#e8f6fa}
#boon.on{display:flex;animation:bfade .35s both}
#boon h2{margin:0 0 4px;font-size:20px;letter-spacing:.04em;color:#ffd27a}
.bc{width:min(340px,100%);display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid var(--c);background:rgba(8,28,36,.85);color:inherit;font:inherit;cursor:pointer;animation:bpop .45s both;animation-delay:calc(var(--n)*.09s);box-shadow:0 0 22px -8px var(--c)}
.bc:active{transform:scale(.97)}
.bc b{font-size:15px;display:block}.bc span{font-size:12.5px;opacity:.75}
.bc em{font-style:normal;font-size:26px;width:44px;text-align:center;color:var(--c)}
@keyframes bpop{from{opacity:0;transform:translateY(18px) scale(.94)}}
@keyframes bfade{from{opacity:0}}
#orank{margin-top:10px;font-size:13px;opacity:.9}
#orank u{display:block;height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden;text-decoration:none}
#orank u i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb02e,#ffd27a);transition:width 1.2s .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- Reklam alanları ---------- */
#cgBanner{display:none;margin:14px auto 0;max-width:100%;min-height:50px;overflow:hidden;text-align:center}
.rr{display:flex;align-items:center;gap:8px;margin-top:6px;padding:11px 18px;border-radius:14px;border:1px solid rgba(255,210,122,.5);background:rgba(255,176,46,.12);color:#ffd27a;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.rr .ico{font-size:18px}.rr:disabled{opacity:.5}
</style>
</head>

<script>
'use strict';
/* =========================================================

/* ---------- Eğim (jiroskop / ivmeölçer) kontrolü ----------
   Dünyanın "yukarı" vektörünü ekran eksenlerinde ölçeriz (dikey/yatay fark etmez).
   roll  = ekranın sağ kenarının ne kadar aşağı eğildiği
   pitch = ekranın üst kenarının ne kadar uzağa eğildiği
   Merkez (n) oyun başında / devam edince oyuncunun rahat tuttuğu duruştan alınır. */
const TILT = { up: [0, 0, 1], has: false, n: null, t: -1e9, ang: -1, gx: 0, gy: 0 };
let tiltBound = false, tiltFail = false;
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const tiltLive = () => performance.now() - TILT.t < 800;
const useTilt = () => S.ctrl === 'tilt' && !tiltFail;
/* MUTLAK mod: telefon yatay (ekran yukarı) = 0. Başlangıç duruşu merkez alınmaz. */
function tiltAngles(u) { return { roll: Math.asin(clamp(-u[0], -1, 1)), pitch: Math.asin(clamp(-u[1], -1, 1)) }; }
function onOrient(e) {
  if (e.beta == null || e.gamma == null || ROT) return;
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  /* dünya "yukarı" yönü, cihaz eksenlerinde */
  const dx = -Math.sin(g) * Math.cos(b), dy = Math.sin(b), dz = Math.cos(g) * Math.cos(b);
  /* ekran dönmüşse (yatay) eksenleri ekrana göre çevir */
  let deg = (window.screen && screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  deg = ((deg % 360) + 360) % 360;
  const a = deg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  const sx = dx * ca - dy * sa, sy = dx * sa + dy * ca, sz = dz;
  if (!TILT.has || deg !== TILT.ang) { TILT.up = [sx, sy, sz]; TILT.has = true; TILT.ang = deg; TILT.n = tiltAngles(TILT.up); }
  else { const k = .4; TILT.up = [lerp(TILT.up[0], sx, k), lerp(TILT.up[1], sy, k), lerp(TILT.up[2], sz, k)]; }
  TILT.t = performance.now();
  if (tiltFail && S.ctrl === 'tilt') tiltFail = false;   /* izin geç verildiyse eğime geri dön */
}
/* Dinleyiciyi hemen ekleriz (izin gerekmeyen tarayıcılarda veri hemen akar), izni de ayrıca isteriz
   (iPhone için şart). Başarı/başarısızlığı izin cevabı değil, gerçekten veri gelip gelmediği belirler. */
async function startTilt() {
  if (typeof DeviceOrientationEvent === 'undefined') return false;
  if (!tiltBound) { window.addEventListener('deviceorientation', onOrient, true); tiltBound = true; }
  try {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') await DeviceOrientationEvent.requestPermission();
  } catch (e) { /* veri gelmezse geri sayımda yakalanır */ }
  return true;
}
function calibrate() { /* mutlak modda gerek yok: sıfır noktası daima yatay */ }
function failTilt() {
  if (tiltFail) return;
  tiltFail = true; TILT.gx = TILT.gy = 0;
  showToast('phone', 'b-slate', t('tiltOff'), t('tiltOffD'));
}
/* Eğimden hız: yön = eğim yönü, hız = eğim miktarı (ölü bölgeden tam eğime kadar yumuşak artış) */
function tiltStep() {
  TILT.gx = TILT.gy = 0;
  if (!tiltLive() || !TILT.n) return [0, 0];
  const c = tiltAngles(TILT.up), n = { roll: 0, pitch: 0 }, D = 180 / Math.PI;
  const tx = wrapA(c.roll - n.roll) * D, ty = wrapA(c.pitch - n.pitch) * D;
  const mag = Math.hypot(tx, ty), full = TILT_FULL / clamp(S.sens, .4, 2);
  if (mag < TILT_DEAD) return [0, 0];
  const k = clamp((mag - TILT_DEAD) / (full - TILT_DEAD), 0, 1), f = Math.pow(k, 1.05);
  const ux = tx / mag, uy = ty / mag;
  TILT.gx = ux * k; TILT.gy = uy * k;
  return [ux * f, -uy * f];
}

async function cgInit() {
  const sdk = cgS(); if (!sdk) return;
  try {
    await sdk.init(); CG.ok = true; CG.env = sdk.environment || 'crazygames';
    try { sdk.game.loadingStart(); CG.loading = true; if (CG.loaded) cgLoaded(); } catch (e) { /* yok say */ }

function cgLoaded() {
  CG.loaded = true;

function cgLang() {

function cgLoadData() {
  try {
    const d = cgS().data; if (!d) return;
    const raw = d.getItem(SAVE_KEY);
    if (!raw) { cgSaveData(); return; }
    const o = JSON.parse(raw);

function cgAd(type, done) {
  if (CG.busy) { done(false); return; }
  if (!realAds()) { if (type === 'rewarded') demoAd(done); else done(false); return; }
  CG.busy = true; cgPlay(false);

    cgS().ad.requestAd(type, {
      adStarted: () => { CG.adMute = true; setVolumes(); },
      adFinished: () => end(true),
      adError: () => end(false)

  } catch (e) { end(false); }
}

/* ---------- Rütbe (kalıcı ilerleme) ---------- */
const rankNeed = r => 80 * r * (r + 1) / 2 * 1;
function rankOf(xp) { let r = 0; while (xp >= rankNeed(r + 1)) r++; return r; }
function giveXp(x) {
  const before = rankOf(S.xp || 0); S.xp = (S.xp || 0) + x; const after = rankOf(S.xp);
  let bonus = 0; for (let r = before + 1; r <= after; r++) bonus += 50 * r;
  S.coins += bonus;
  const lo = rankNeed(after), hi = rankNeed(after + 1), pct = Math.round((S.xp - lo) / (hi - lo) * 100);
  $('orank').innerHTML = `${t('rank')} ${after} · +${x} XP${bonus ? ' · +' + bonus + ' ' + t('coin') : ''}<u><i id="orBar"></i></u>`;
  setTimeout(() => { const b = $('orBar'); if (b) b.style.width = pct + '%'; }, 60);
  if (after > before) showToast('starf', 'b-cyan', t('rankUp'), t('newRank') + after);
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const o = JSON.parse(raw);
      S = Object.assign(S, o);
      S.up = Object.assign({}, DEF.up, o.up);
      S.st = Object.assign({}, DEF.st, o.st);
      S.ach = o.ach || {};
    } else {
      migrateV1();
    }
  } catch (e) { /* kayıt okunamadı: varsayılanlarla devam */ }
  if (!S.lang) S.lang = (navigator.language || 'en').slice(0, 2);
  if (!L[S.lang]) S.lang = 'en';
  muted = !!S.muted;
  if (S.ctrl !== 'tilt' && S.ctrl !== 'touch') S.ctrl = 'tilt';
  S.sens = clamp(+S.sens || 1, .5, 1.6);
  /* dokunmatik olmayan cihazda (masaüstü) eğim anlamsız: fare/klavye ile başla */
  if (!S.ctrlSeen && !TOUCHDEV) { S.ctrl = 'touch'; S.ctrlSeen = 1; }
}
/* Eski sürümden jeton, kostüm ve yükseltmeleri taşı */
function migrateV1() {
  const raw = localStorage.getItem('phantrail_v1');
  if (!raw) return;
  const o = JSON.parse(raw);
  S.coins = o.coins | 0;
  const own = o.own || [];
  S.skins = own.filter(id => /^s[0-3]$/.test(id));
  if (!S.skins.includes('s0')) S.skins.unshift('s0');
  S.skin = S.skins.includes(o.skin) ? o.skin : 's0';
  ['u0', 'u1', 'u2'].forEach(id => { if (own.includes(id)) S.up[id] = 1; });
  if (typeof o.music === 'number') S.music = o.music;
  if (typeof o.sfx === 'number') S.sfx = o.sfx;
  if (typeof o.shake === 'number') S.shake = o.shake;
  if (o.lang) S.lang = o.lang;
  S.sc = (o.sc || []).map(r => ({ s: r.s, k: r.k, w: r.w, lv: 1, m: 'm0', d: 0 }));
}
const sv = () => { S.ts = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* depolama kapalı */ } cgSaveData(); };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  /* düşük çözünürlüklü vinyet önbelleği */
  VIG = document.createElement('canvas');
  VIG.width = Math.ceil(W / 2); VIG.height = Math.ceil(H / 2);
  const v = VIG.getContext('2d');
  const g = v.createRadialGradient(VIG.width / 2, VIG.height / 2, Math.min(VIG.width, VIG.height) * .35,
    VIG.width / 2, VIG.height / 2, Math.max(VIG.width, VIG.height) * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
  v.fillStyle = g; v.fillRect(0, 0, VIG.width, VIG.height);
  /* film greni + süzülen toz */
  GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 128;

function dots(c, w, h, gs, col) {
  c.fillStyle = col; c.beginPath();
  for (let x = gs / 2; x < w; x += gs) for (let y = gs / 2; y < h; y += gs) c.rect(x, y, 2, 2);
  c.fill();
}
function drawFlies(c, list, T, w, h, rgb) {
  c.globalCompositeOperation = 'lighter';
  for (const f of list) {
    const x = (f.x + Math.sin(T * f.sp + f.ph) * .03) * w, y = (f.y + Math.cos(T * f.sp * 1.3 + f.ph) * .03) * h;
    const a = .25 + .45 * Math.max(0, Math.sin(T * 1.6 + f.ph));
    glowC(c, x, y, f.r * 6, rgb, a * .55);
    c.fillStyle = `rgba(${rgb},${a + .2})`; c.beginPath(); c.arc(x, y, f.r * .7, 0, TAU); c.fill();
  }
  c.globalCompositeOperation = 'source-over';
}
function drawStars(c, list, T, w, h, maxY) {
  c.fillStyle = '#fff';
  for (const q of list) {
    if (q.y > maxY) continue;
    c.globalAlpha = (.2 + .5 * Math.abs(Math.sin(T * q.sp + q.ph))) * q.a;
    c.fillRect(q.x * w, q.y * h, q.r, q.r);
  }
  c.globalAlpha = 1;
}
/* çam ağaçları siluet katmanı */
const PINE = [[-1, 0], [-.5, -.35], [-.75, -.35], [-.3, -.7], [-.5, -.7], [0, -1], [.5, -.7], [.3, -.7], [.75, -.35], [.5, -.35], [1, 0]];
function pines(c, w, h, base, hMin, hMax, seed, step, col, T, sway) {
  c.fillStyle = col; c.beginPath(); c.moveTo(-20, h); c.lineTo(-20, base);
  let i = 0;
  for (let x = -10; x < w + 30; x += step, i++) {
    const th = h * lerp(hMin, hMax, srand(seed + i)), half = th * .16, sw = Math.sin(T * .7 + i) * sway;
    for (const [dx, dy] of PINE) c.lineTo(x + dx * half - dy * sw, base + dy * th);
  }
  c.lineTo(w + 30, base); c.lineTo(w + 30, h); c.closePath(); c.fill();
}

const SKINS = [
  { id: 's0', price: 0, core: '#fff6e0', glow: '255,246,224', fx: 'soft' },
  { id: 's1', price: 150, core: '#8feaff', glow: '127,233,255', fx: 'ice' },
  { id: 's2', price: 250, core: '#ff9ad5', glow: '255,154,213', fx: 'petal' },
  { id: 's3', price: 400, core: '#ffd24a', glow: '255,210,74', fx: 'spark' },
  { id: 's4', price: 600, core: '#ff8a3a', glow: '255,122,46', fx: 'flame' },
  { id: 's5', price: 850, core: '#9affd8', glow: '122,255,200', fx: 'rainbow' },
  { id: 's6', price: 1100, core: '#c58bff', glow: '197,139,255', fx: 'void' },
  { id: 's7', price: 1500, core: '#d4ff3a', glow: '212,255,58', fx: 'bolt' }
];
const curSkin = () => SKINS.find(s => s.id === S.skin) || SKINS[0];
function hue2rgb(h) {
  h = ((h % 360) + 360) % 360 / 60;
  const x = 1 - Math.abs(h % 2 - 1);
  let r = 0, g = 0, b = 0;
  if (h < 1) { r = 1; g = x; } else if (h < 2) { r = x; g = 1; } else if (h < 3) { g = 1; b = x; }
  else if (h < 4) { g = x; b = 1; } else if (h < 5) { r = x; b = 1; } else { r = 1; b = x; }
  return `${Math.round(55 + r * 200)},${Math.round(55 + g * 200)},${Math.round(55 + b * 200)}`;
}
const skRGB = (sk, T, o = 0) => sk.fx === 'rainbow' ? hue2rgb(T * 80 + o) : sk.glow;

/* Oyuncu gövdesi: parıltı + kostüme özel süsler + çekirdek */
function drawSkin(c, sk, x, y, r, T) {
  const rgb = skRGB(sk, T);
  c.save();
  c.globalCompositeOperation = 'lighter';
  glowC(c, x, y, r * 4.2, rgb, .36);
  c.globalCompositeOperation = 'source-over';
  switch (sk.fx) {
    case 'ice':
      c.strokeStyle = `rgba(${rgb},.75)`; c.lineWidth = 1.6;
      for (let i = 0; i < 6; i++) {
        const a = T * .8 + i * TAU / 6, ix = Math.cos(a), iy = Math.sin(a);
        c.beginPath(); c.moveTo(x + ix * r * 1.2, y + iy * r * 1.2); c.lineTo(x + ix * r * 2.1, y + iy * r * 2.1); c.stroke();
        const bx = x + ix * r * 1.7, by = y + iy * r * 1.7, pa = a + 1.57;
        c.beginPath(); c.moveTo(bx - Math.cos(pa) * r * .35, by - Math.sin(pa) * r * .35);
        c.lineTo(bx + Math.cos(pa) * r * .35, by + Math.sin(pa) * r * .35); c.stroke();
      }
      break;
    case 'petal':
      for (let i = 0; i < 5; i++) {
        const a = T * 1.2 + i * TAU / 5;
        c.fillStyle = 'rgba(255,170,220,.85)'; c.beginPath();
        c.ellipse(x + Math.cos(a) * r * 1.6, y + Math.sin(a) * r * 1.6, r * .62, r * .34, a, 0, TAU); c.fill();
      }
      break;
    case 'spark': {
      c.fillStyle = 'rgba(255,226,122,.85)'; c.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = T * .9 + i * Math.PI / 4, rr = i % 2 ? r * .7 : r * 2.4;
        c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      c.closePath(); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(x + Math.cos(T * 2.4) * r * 1.9, y + Math.sin(T * 2.4) * r * 1.9, r * .22, 0, TAU); c.fill();
      break;
    }
    case 'flame':
      for (let i = -1; i <= 1; i++) {
        const fx = x + i * r * .7, hh = r * (1.5 + Math.sin(T * 9 + i * 2) * .5);
        c.fillStyle = i === 0 ? 'rgba(255,190,60,.9)' : 'rgba(255,120,40,.8)'; c.beginPath();
        c.moveTo(fx - r * .45, y); c.quadraticCurveTo(fx - r * .3, y - hh * .6, fx, y - hh - r * .5);
        c.quadraticCurveTo(fx + r * .3, y - hh * .6, fx + r * .45, y); c.fill();
      }
      break;
    case 'rainbow':
      c.lineWidth = 2.2;
      for (let i = 0; i < 6; i++) {
        c.strokeStyle = `rgba(${hue2rgb(T * 80 + i * 60)},.95)`; c.beginPath();
        c.arc(x, y, r * 1.6, T * 1.6 + i * TAU / 6, T * 1.6 + i * TAU / 6 + TAU / 6 - .15); c.stroke();
      }
      break;
    case 'void':
      c.save(); c.translate(x, y); c.rotate(T * .8); c.scale(1, .38);
      c.strokeStyle = `rgba(${rgb},.85)`; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, r * 2.1, 0, TAU); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1; c.beginPath(); c.arc(0, 0, r * 2.1, 0, TAU * .3); c.stroke();
      c.restore();
      break;
    case 'bolt':
      c.strokeStyle = `rgba(${rgb},.9)`; c.lineWidth = 1.5;
      for (let k = 0; k < 3; k++) {
        const a0 = T * 2 + k * TAU / 3;
        c.beginPath(); c.moveTo(x + Math.cos(a0) * r * 1.2, y + Math.sin(a0) * r * 1.2);
        for (let j = 1; j <= 4; j++) {
          const a = a0 + j * .28, rr = r * (1.2 + j * .22) + rnd(-3, 3);
          c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        c.stroke();
      }
      break;
    default: break;
  }
  /* çekirdek */
  if (sk.fx === 'void') {
    c.fillStyle = '#08000f'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
    c.strokeStyle = `rgba(${rgb},.95)`; c.lineWidth = 2; c.stroke();
  } else {
    c.fillStyle = sk.fx === 'rainbow' ? `rgb(${hue2rgb(T * 80)})` : sk.core;
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(x - r * .3, y - r * .3, r * .35, 0, TAU); c.fill();
  }
  c.restore();
}

/* Oyuncunun arkasındaki ışık şeridi */
function playerTrail(sk) {
  const n = Math.min(hist.length, 34);
  if (n < 3) return;
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (let i = 1; i < n; i++) {
    const a = hist[hist.length - n + i - 1], b = hist[hist.length - n + i], q = i / n;
    ctx.strokeStyle = `rgba(${skRGB(sk, T, i * 6)},${q * .42})`; ctx.lineWidth = P.r * 1.7 * q;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* Tehlike anında kenarları kızartan vinyet (boyut değişince yeniden kurulur) */
function buildRVig() {
  RVIG = document.createElement('canvas');
  RVIG.width = Math.ceil(W / 2); RVIG.height = Math.ceil(H / 2);
  const v = RVIG.getContext('2d');
  const g = v.createRadialGradient(RVIG.width / 2, RVIG.height / 2, Math.min(RVIG.width, RVIG.height) * .3,
    RVIG.width / 2, RVIG.height / 2, Math.max(RVIG.width, RVIG.height) * .72);
  g.addColorStop(0, 'rgba(255,40,50,0)'); g.addColorStop(1, 'rgba(255,40,50,.75)');
  v.fillStyle = g; v.fillRect(0, 0, RVIG.width, RVIG.height);
}
function starPath(c, x, y, r1, r2, n, rot) {
  c.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * Math.PI / n, rr = i % 2 ? r2 : r1;
    c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  c.closePath();
}

/* Kristal: dönen elmas + ömür halkası + yörünge kıvılcımları */
function drawShard(c, s) {
  const k = clamp(s.age / .45, 0, 1), grow = easeOutBack(k) * (1 + .06 * Math.sin(T * 5));
  const low = s.life < 2.2, blink = low && Math.sin(T * 18) < -.2;
  const x = s.x, y = s.y + Math.sin(T * 3 + s.x * .01) * 2.5, r = 15 * grow, frac = clamp(s.life / s.max, 0, 1);
  c.save();
  c.globalCompositeOperation = 'lighter';
  glowC(c, x, y, r * 3.8, low ? '255,110,90' : '255,176,46', blink ? .14 : .4);
  c.globalCompositeOperation = 'source-over';
  /* ömür halkası */
  c.lineWidth = 3; c.lineCap = 'round';
  c.strokeStyle = 'rgba(255,246,224,.12)'; c.beginPath(); c.arc(x, y, r * 1.8, 0, TAU); c.stroke();
  c.strokeStyle = low ? '#ff6a5a' : '#ffc24d';
  c.beginPath(); c.arc(x, y, r * 1.8, -Math.PI / 2, -Math.PI / 2 + TAU * frac); c.stroke();
  /* gövde: yatayda sıkışarak dönüyormuş gibi görünür */
  c.translate(x, y);
  c.scale(.38 + .62 * Math.abs(Math.cos(T * 2.4 + s.x * .01)), 1);
  const gr = c.createLinearGradient(0, -r * 1.4, 0, r * 1.4);
  gr.addColorStop(0, '#fff3b0'); gr.addColorStop(.5, '#ffc24d'); gr.addColorStop(1, '#ff8a1f');
  c.fillStyle = blink ? 'rgba(255,200,120,.45)' : gr;
  c.beginPath(); c.moveTo(0, -r * 1.4); c.lineTo(r, 0); c.lineTo(0, r * 1.4); c.lineTo(-r, 0); c.closePath(); c.fill();
  c.lineWidth = 1.4; c.strokeStyle = 'rgba(255,255,255,.8)'; c.stroke();
  c.beginPath(); c.moveTo(-r, 0); c.lineTo(r, 0); c.moveTo(0, -r * 1.4); c.lineTo(0, r * 1.4);
  c.strokeStyle = 'rgba(255,255,255,.32)'; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.55)';
  c.beginPath(); c.moveTo(-r * .1, -r * 1.1); c.lineTo(r * .5, -r * .1); c.lineTo(-r * .1, -r * .2); c.closePath(); c.fill();
  c.restore();
  /* yörünge kıvılcımları */
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const a = T * 1.8 + i * TAU / 3, sx = x + Math.cos(a) * r * 2.5, sy = y + Math.sin(a) * r * 2.5;
    c.fillStyle = 'rgba(255,240,180,.85)'; starPath(c, sx, sy, 3.4, .9, 4, T * 2 + i); c.fill();
  }
  c.restore();
}

/* Bonus küre: tipine göre simge, ömür halkası */
function drawOrb(c, o) {
  const k = clamp(o.age / .4, 0, 1), rgb = ORBC[o.type][0], hex = ORBC[o.type][1];
  const frac = clamp(o.life / o.max, 0, 1), blink = o.life < 2.5 && Math.sin(T * 16) < 0;
  const r = 17 * easeOutBack(k) * (1 + .05 * Math.sin(T * 4)), x = o.x, y = o.y + Math.sin(T * 2.6) * 3;
  c.save();
  c.globalCompositeOperation = 'lighter';
  glowC(c, x, y, r * 3.3, rgb, blink ? .12 : .36);
  c.globalCompositeOperation = 'source-over';
  c.lineCap = 'round'; c.lineWidth = 3;
  c.strokeStyle = `rgba(${rgb},.22)`; c.beginPath(); c.arc(x, y, r * 1.55, 0, TAU); c.stroke();
  c.strokeStyle = hex; c.beginPath(); c.arc(x, y, r * 1.55, -Math.PI / 2, -Math.PI / 2 + TAU * frac); c.stroke();
  c.translate(x, y);
  c.fillStyle = 'rgba(6,18,24,.9)'; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
  c.lineWidth = 2; c.strokeStyle = hex; c.stroke();
  c.scale(r / 17, r / 17);
  c.fillStyle = hex; c.strokeStyle = '#fff'; c.lineWidth = 1.2; c.lineJoin = 'round';
  if (o.type === 'shield') {
    c.beginPath(); c.moveTo(0, -9); c.lineTo(8, -5); c.lineTo(7, 4); c.lineTo(0, 10); c.lineTo(-7, 4); c.lineTo(-8, -5); c.closePath();
    c.globalAlpha = .9; c.fill(); c.globalAlpha = 1; c.stroke();
    c.beginPath(); c.moveTo(0, -5); c.lineTo(0, 6); c.strokeStyle = 'rgba(255,255,255,.55)'; c.stroke();
  } else if (o.type === 'nova') {
    starPath(c, 0, 0, 10, 4, 8, T * 1.5); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 2.6, 0, TAU); c.fill();
  } else if (o.type === 'chrono') {
    c.beginPath(); c.arc(0, 0, 8, 0, TAU); c.globalAlpha = .9; c.fill(); c.globalAlpha = 1; c.stroke();
    c.beginPath(); c.moveTo(0, -5); c.lineTo(0, 0); c.lineTo(4, 2); c.strokeStyle = '#06141a'; c.lineWidth = 2; c.stroke();
  } else if (o.type === 'surge') {
    c.beginPath(); c.moveTo(3, -10); c.lineTo(-6, 1); c.lineTo(-1, 1); c.lineTo(-3, 10); c.lineTo(6, -2); c.lineTo(1, -2); c.closePath(); c.fill(); c.stroke();
  } else {
    c.beginPath(); c.moveTo(-7, -4); c.lineTo(-3.5, -9); c.lineTo(3.5, -9); c.lineTo(7, -4); c.lineTo(0, 9); c.closePath();
    c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-7, -4); c.lineTo(7, -4); c.moveTo(-3.5, -9); c.lineTo(-2, -4); c.lineTo(0, 9);
    c.moveTo(3.5, -9); c.lineTo(2, -4); c.lineTo(0, 9); c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1; c.stroke();
  }
  c.restore();
}

/* Yankının önündeki rota (noktalı) ve arkasındaki sönük iz */
function drawGhostTrail(c, g) {
  const i = tick - g.lag - hoff;
  if (i < 0 || i >= hist.length) return;
  const a = g.f;
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  const end = Math.min(hist.length - 1, i + 100);
  if (end > i + 3) {
    c.strokeStyle = `rgba(255,90,95,${.07 + .12 * a})`; c.lineWidth = 2; c.setLineDash([2, 9]);
    c.beginPath(); c.moveTo(hist[i][0], hist[i][1]);
    for (let j = i + 3; j <= end; j += 3) c.lineTo(hist[j][0], hist[j][1]);
    c.stroke(); c.setLineDash([]);
  }
  c.globalCompositeOperation = 'lighter';
  for (let k = 1; k <= 9; k++) {
    const j = i - k * 2; if (j < 0) break;
    const q = 1 - k / 10;
    c.fillStyle = `rgba(255,70,80,${q * .16 * a})`;
    c.beginPath(); c.arc(hist[j][0], hist[j][1], g.r * (.35 + .5 * q), 0, TAU); c.fill();
  }
  c.restore();
}
/* Yankı gövdesi: doğarken noktalı çizgi halka, olgunlaşınca bakan gözler */
function drawGhost(c, g) {
  const a = g.f, rr = g.r * (.7 + .3 * a) * (1 + .06 * Math.sin(T * 6 + g.ph));
  c.save();
  if (a < 1) {
    c.strokeStyle = `rgba(255,110,115,${.25 + .4 * a})`; c.lineWidth = 2; c.setLineDash([4, 5]);
    c.beginPath(); c.arc(g.x, g.y, rr * 1.2 + (1 - a) * 12, 0, TAU); c.stroke(); c.setLineDash([]);
    c.globalCompositeOperation = 'lighter'; glowC(c, g.x, g.y, rr * 3, '255,70,80', .12 * a); c.restore(); return;
  }
  c.globalCompositeOperation = 'lighter'; glowC(c, g.x, g.y, rr * 3.4, '255,70,80', .34); c.globalCompositeOperation = 'source-over';
  c.fillStyle = '#2a0508'; c.beginPath(); c.arc(g.x, g.y, rr, 0, TAU); c.fill();
  c.strokeStyle = '#ff5a5f'; c.lineWidth = 2.2; c.stroke();
  c.strokeStyle = 'rgba(255,150,150,.45)'; c.lineWidth = 1;
  c.beginPath(); c.arc(g.x, g.y, rr * (1.5 + .2 * Math.sin(T * 5 + g.ph)), 0, TAU); c.stroke();
  const dx = P.x - g.x, dy = P.y - g.y, d = Math.hypot(dx, dy) || 1, ex = dx / d * rr * .22, ey = dy / d * rr * .22;
  for (const s of [-1, 1]) {
    const ox = g.x + s * rr * .34 + ex, oy = g.y - rr * .08 + ey;
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ox, oy, rr * .22, 0, TAU); c.fill();
    c.fillStyle = '#12000a'; c.beginPath(); c.arc(ox + ex * .5, oy + ey * .5, rr * .1, 0, TAU); c.fill();
  }
  c.restore();
}
function drawShield(c) {
  const r = P.r * 2.5 + Math.sin(T * 5) * 1.5;
  c.save();
  c.fillStyle = 'rgba(127,233,255,.1)'; c.beginPath(); c.arc(P.x, P.y, r, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(127,233,255,.85)'; c.lineWidth = 2; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const a = T * 2 + i * TAU / 3; c.beginPath(); c.arc(P.x, P.y, r, a, a + .5); c.stroke();
  }
  c.restore();
}
function drawAim(c) {
  c.save();
  c.strokeStyle = 'rgba(127,233,255,.45)'; c.lineWidth = 1.5;
  c.beginPath(); c.arc(tgt.x, tgt.y, 9 + Math.sin(T * 5) * 1.5, 0, TAU); c.stroke();
  c.fillStyle = 'rgba(127,233,255,.75)'; c.beginPath(); c.arc(tgt.x, tgt.y, 2, 0, TAU); c.fill();
  c.restore();
}
/* Eğim göstergesi: ekranın altında, telefonun ne kadar eğildiğini gösteren küçük halka */
function drawGauge(c) {
  const R = 24, cx = W / 2, cy = H - 46 - 6;
  c.save();
  c.globalAlpha = .55; c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,246,224,.55)';
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke();
  c.globalAlpha = .3; c.beginPath(); c.arc(cx, cy, R * .2, 0, TAU); c.stroke();
  c.globalAlpha = .9; c.fillStyle = '#ffc24d';
  c.beginPath(); c.arc(cx + TILT.gx * R, cy - TILT.gy * R, 5, 0, TAU); c.fill();
  c.restore();
}
function drawDust(c) {
  if (!DUST) return;
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const d of DUST) {
    const x = ((d.x + T * d.vx) % W + W) % W, y = ((d.y + T * d.vy + Math.sin(T * d.f + d.p) * 14) % H + H) % H;
    c.fillStyle = `rgba(255,236,190,${d.a * (.55 + .45 * Math.sin(T * d.f * 1.7 + d.p))})`;
    c.beginPath(); c.arc(x, y, d.r, 0, TAU); c.fill();
  }
  c.restore();
}
function drawPlayerGlow(c, sk) {
  const R = P.r * 7, rgb = skRGB(sk, T, 0), g = c.createRadialGradient(P.x, P.y, 0, P.x, P.y, R);
  g.addColorStop(0, `rgba(${rgb},.30)`); g.addColorStop(1, `rgba(${rgb},0)`);
  c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = g; c.fillRect(P.x - R, P.y - R, R * 2, R * 2); c.restore();
}
function drawParts(c) {
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const q = clamp(p.l / p.m, 0, 1), s = p.s * (.4 + .6 * q);
    c.globalAlpha = q; c.fillStyle = p.c;
    if (p.sh === 'ci') { c.beginPath(); c.arc(p.x, p.y, s, 0, TAU); c.fill(); }
    else if (p.sh === 'st') { starPath(c, p.x, p.y, s * 1.7, s * .5, 4, p.l * 3); c.fill(); }
    else c.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  c.restore();
}
function drawFx(c) {
  c.save();
  for (const r of rings) {
    const q = clamp(r.l / r.m, 0, 1);
    c.strokeStyle = `rgba(${r.c},${q * .8})`; c.lineWidth = Math.max(.5, r.w * q);
    c.beginPath(); c.arc(r.x, r.y, r.r, 0, TAU); c.stroke();
  }
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  for (const q of texts) {
    c.globalAlpha = clamp(q.l * 2, 0, 1);
    c.font = `800 ${q.z}px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif`;
    c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.55)'; c.strokeText(q.s, q.x, q.y);
    c.fillStyle = q.c; c.fillText(q.s, q.x, q.y);
  }
  c.restore();
}

function draw() {
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  MAPS[mapIdx()].draw(c, bgState, W, H, T);
  /* kamera: sarsıntı + hafif yakınlaşma yalnızca oyun katmanında */
  const sh = S.shake ? shake : 0;
  c.setTransform(DPR * zoom, 0, 0, DPR * zoom,
    (W / 2 * (1 - zoom) + (sh > .2 ? rnd(-sh, sh) : 0)) * DPR, (H / 2 * (1 - zoom) + (sh > .2 ? rnd(-sh, sh) : 0)) * DPR);
  const sk = curSkin(), playing = st === 'play' || st === 'count', alive = st !== 'dead' && st !== 'over';
  drawDust(c);
  for (const g of ghosts) if (g.on) drawGhostTrail(c, g);
  if (shard) drawShard(c, shard);
  if (orb) drawOrb(c, orb);
  for (const g of ghosts) if (g.on) drawGhost(c, g);
  if (alive) {
    playerTrail(sk); drawPlayerGlow(c, sk);
    c.save();
    if (invul > 0 && ((invul >> 2) & 1)) c.globalAlpha = .4;
    drawSkin(c, sk, P.x, P.y, P.r, T);
    c.restore();
    if (shield) drawShield(c);
  }
  if (playing && usingMouse && !useTilt()) drawAim(c);
  drawParts(c); drawFx(c);
  /* ekran katmanı */
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (VIG) c.drawImage(VIG, 0, 0, W, H);
  if (GPAT) { if (frame % 3 === 0) gOff = [(Math.random() * 128) | 0, (Math.random() * 128) | 0]; c.save(); c.translate(-gOff[0], -gOff[1]); c.globalAlpha = .06; c.globalCompositeOperation = 'overlay'; c.fillStyle = GPAT; c.fillRect(gOff[0], gOff[1], W + 128, H + 128); c.restore(); }
  if (playing && useTilt()) drawGauge(c);
  if (danger > .02 && RVIG) {
    c.globalAlpha = clamp(danger * (.5 + .4 * Math.sin(T * 10)), 0, .85);
    c.drawImage(RVIG, 0, 0, W, H); c.globalAlpha = 1;
  }
  if (flash > .02) { c.fillStyle = `rgba(${flashC},${flash * .35})`; c.fillRect(0, 0, W, H); }
}

const SCREENS = ['menu', 'help', 'board', 'shop', 'settings', 'ctrl', 'pause', 'over'];
const SUBS = ['help', 'board', 'shop', 'settings', 'ctrl'];
let shopTab = 'skin', boardTab = 'score', introReady = false;
const fmt = n => Number(n).toLocaleString(S.lang);

/* Ekran geçişi: yalnızca biri açık, diğerleri 'inert' (klavye odağı almaz) */
function show(name) {
  if (name !== 'over') cgBanner(false);
  if (name && curScreen && name !== curScreen) navFrom = curScreen;
  const changed = name !== curScreen;
  SCREENS.forEach(id => {
    const el = $(id), off = id !== name;
    el.classList.toggle('off', off); el.toggleAttribute('inert', off);
    if (!off && changed) el.scrollTop = 0;
  });
  curScreen = name || null;
  if (name === 'shop') renderShop(true);
  else if (name === 'board') renderBoard(true);
  else if (name === 'settings') renderSettings();
  else if (name === 'help') renderHelp();
}
function back() { show(navFrom && navFrom !== curScreen ? navFrom : 'menu'); }

/* Menü / üst çubuktaki sayılar */
function menuStats() {
  const coin = ico('coin') + '<b>' + fmt(S.coins) + '</b>';
  $('mc').textContent = fmt(S.coins);
  $('mh').textContent = fmt(S.sc.length ? S.sc[0].s : 0);

}

}

/* ---------- Önizleme tuvalleri (mağaza ve haritalar) ---------- */
function attachPreview(scr, el, ratio, fn) {
  if (!el) return;
  const w = Math.max(60, el.offsetWidth || 150), h = Math.round(w * ratio), d = Math.min(DPR, 2);
  el.width = Math.round(w * d); el.height = Math.round(h * d);
  previews.push({ scr, c: el.getContext('2d'), w, h, d, fn });
}
function drawPreviews() {
  for (const p of previews) {
    if (p.scr !== curScreen) continue;
    p.c.setTransform(p.d, 0, 0, p.d, 0, 0); p.c.globalAlpha = 1; p.c.globalCompositeOperation = 'source-over';
    p.fn(p.c, p.w, p.h);
  }
}
function skinPreview(sk, locked) {
  return (c, w, h) => {
    const g = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * .75);
    g.addColorStop(0, '#0e3640'); g.addColorStop(1, '#030d11');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    const pos = q => [w / 2 + Math.cos(q * 1.3) * w * .24, h / 2 + Math.sin(q * 2.6) * h * .16];
    c.globalCompositeOperation = 'lighter';
    for (let k = 22; k >= 1; k--) {
      const q = 1 - k / 22, p = pos(T - k * .03);
      c.fillStyle = `rgba(${skRGB(sk, T, k * 8)},${q * .35})`;
      c.beginPath(); c.arc(p[0], p[1], w * .05 * q, 0, TAU); c.fill();
    }
    c.globalCompositeOperation = 'source-over';
    const p = pos(T);
    drawSkin(c, sk, p[0], p[1], w * .065, T);
    if (locked) { c.fillStyle = 'rgba(2,10,14,.55)'; c.fillRect(0, 0, w, h); }
  };
}

  } else if (shopTab === 'map') {
    h = MAPS.map((m, i) => {
      const own = S.maps.includes(m.id), cur = S.map === m.id;
      const btn = cur ? `<button class="act cur" tabindex="-1">${ico('check')}<span>${t('inUse')}</span></button>`
        : own ? `<button class="act own" onclick="pickMap('${m.id}')"><span>${t('use')}</span></button>`
          : `<button class="act" onclick="pickMap('${m.id}')">${ico('coin')}<span>${fmt(m.price)}</span></button>`;
      return `<div class="mcard ${cur ? 'sel' : ''}${stAttr(anim, i + 2)}"><canvas id="mv${i}"></canvas>` +
        (own ? '' : `<span class="lockb">${ico('lock')}</span>`) +
        `<div class="mrow"><div class="utx"><b>${t('mp' + i)}</b><small>${t('md' + i)}</small></div>${btn}</div></div>`;
    }).join('');
  } else {
    h = Object.keys(UPG).map((id, i) => {
      const u = UPG[id], lv = S.up[id], maxed = lv >= u.max, n = id.slice(1);
      const pips = Array.from({ length: u.max }, (_, k) => `<i class="${k < lv ? 'on' : ''}"></i>`).join('');
      const btn = maxed ? `<button class="act cur" tabindex="-1">${t('maxed')}</button>`
        : `<button class="act" onclick="buyUp('${id}')">${ico('coin')}<span>${fmt(u.price[lv])}</span></button>`;
      return `<div class="urow${stAttr(anim, i + 2)}"><span class="badge ${u.bc}">${ico(u.ic)}</span>` +
        `<div class="utx"><b>${t('up' + n)}</b><small>${t('ud' + n)}</small><div class="pips">${pips}</div></div>${btn}</div>`;
    }).join('');
  }
  $('sl').innerHTML = h;
  if (shopTab === 'skin') SKINS.forEach((sk, i) => attachPreview('shop', $('pv' + i), 1, skinPreview(sk, !S.skins.includes(sk.id))));
  else if (shopTab === 'map') {
    MAPS.forEach((m, i) => {
      const ps = m.mk(), own = S.maps.includes(m.id);
      attachPreview('shop', $('mv' + i), .4, (c, w, h) => {
        m.draw(c, ps, w, h, T);
        if (!own) { c.fillStyle = 'rgba(2,10,14,.5)'; c.fillRect(0, 0, w, h); }
      });
    });
  }
}
function buySkin(id) {
  const sk = SKINS.find(s => s.id === id); if (!sk) return;
  if (S.skins.includes(id)) { if (S.skin === id) return; S.skin = id; SFX.equip(); sv(); renderShop(); return; }
  if (S.coins < sk.price) return poor();
  S.coins -= sk.price; S.skins.push(id); S.skin = id;
  SFX.buy(); vib(20); sv(); renderShop(); checkAch();
}
function buyUp(id) {
  const u = UPG[id], lv = S.up[id]; if (!u || lv >= u.max) return;
  if (S.coins < u.price[lv]) return poor();
  S.coins -= u.price[lv]; S.up[id]++;
  SFX.buy(); vib(20); sv(); renderShop();
}

/* ---------- Haritalar (mağazanın bir sekmesi) ---------- */
function pickMap(id) {
  const m = MAPS.find(x => x.id === id); if (!m) return;
  if (S.maps.includes(id)) { if (S.map === id) return; S.map = id; setMap(); SFX.equip(); }
  else {
    if (S.coins < m.price) return poor();
    S.coins -= m.price; S.maps.push(id); S.map = id; setMap(); SFX.buy(); vib(20);
  }
  sv(); renderShop();
}

/* ---------- Rekorlar ve başarımlar ---------- */
function setBoardTab(id) { boardTab = id; renderBoard(true); }
function renderBoard(anim) {
  $('boardTabs').innerHTML = tabsHtml([['score', 'trophy', 'tabScore'], ['ach', 'award', 'tabAch']], boardTab, 'setBoardTab');
  let h = '';
  if (boardTab === 'score') {
    const boxes = [['games', S.st.games], ['crys', S.st.k], ['combo', 'x' + S.st.combo], ['wins', S.st.wins]];
    h = `<div class="sgrid${stAttr(anim, 1)}">` + boxes.map(([k, v]) =>
      `<div class="sbox"><b>${typeof v === 'number' ? fmt(v) : v}</b><small>${t(k)}</small></div>`).join('') + '</div>';
    if (!S.sc.length) h += `<p class="muted center">${t('empty')}</p>`;
    else h += S.sc.map((r, i) => {
      const mi = MAPS.findIndex(m => m.id === r.m), mn = mi >= 0 ? t('mp' + mi) : '';
      return `<div class="srow${stAttr(anim, i + 2)}"><span class="rank r${i + 1}">${i + 1}</span>` +
        `<div class="sv"><b>${fmt(r.s)}</b><small>${t('lv')} ${r.lv || 1} · ${r.k} ${t('k')}${mn ? ' · ' + mn : ''}</small></div>` +
        (r.w ? `<span class="winb">${ico('trophy')}</span>` : '') + '</div>';
    }).join('');
  } else {
    h = ACH.map((a, i) => {
      const done = !!S.ach[a.id];
      return `<div class="arow ${done ? 'done' : ''}${stAttr(anim, i + 1)}"><span class="badge ${a.bc}">${ico(a.ic)}</span>` +
        `<div class="utx"><b>${t(a.id + 'n')}</b><small>${t(a.id + 'd')}</small></div>` +
        `<span class="reward">${done ? ico('check') : ico('coin') + '+' + a.coins}</span></div>`;
    }).join('');
  }
  $('bl').innerHTML = h;
}

/* ---------- Nasıl oynanır ---------- */
function renderHelp() {
  const items = [['cursor', 'b-cyan'], ['ghost', 'b-red'], ['zap', 'b-amber'], ['layers', 'b-green'], ['sparkles', 'b-violet']];
  $('hl2').innerHTML = items.map(([ic, bc], i) =>
    `<div class="hrow st" style="--i:${i + 1}"><span class="badge ${bc}">${ico(ic)}</span>` +
    `<div class="utx"><b>${t('h' + (i + 1) + 't')}</b><small>${t('h' + (i + 1) + 'd')}</small></div></div>`).join('');
}

/* ---------- Ayarlar ---------- */
function fillRange(el) { el.style.setProperty('--v', (el.value / (el.max || 1) * 100) + '%'); }
function onVol(which, el) { S[which] = +el.value; fillRange(el); setVolumes(); }
function toggleSet(k) {
  S[k] = S[k] ? 0 : 1; sv(); renderSettings();
  if (k === 'haptic' && S.haptic) vib(30);
}
function onSens(el) { S.sens = +el.value; fillRange(el); }
function setCtrl(id) {
  S.ctrl = id; sv(); tiltFail = false;
  if (id === 'tilt') startTilt().then(ok => { if (!ok && S.ctrl === 'tilt') failTilt(); });
  renderSettings();
}
/* İlk açılış kontrol seçimi: izin isteği kullanıcı dokunuşunun içinde yapılır (iOS için gerekli) */
function chooseCtrl(id) {
  S.ctrl = id; S.ctrlSeen = 1; sv(); play();
}
function tryPlay() { if (!S.ctrlSeen) show('ctrl'); else play(); }
function renderSettings() {
  const vm = $('vm'), vs = $('vs'), vn = $('vsn');
  vm.value = S.music; vs.value = S.sfx; fillRange(vm); fillRange(vs);
  vn.value = S.sens; fillRange(vn); $('sensRow').style.display = S.ctrl === 'tilt' ? '' : 'none';
  $('vmu').classList.toggle('on', !muted);
  $('vk').classList.toggle('on', !!S.shake); $('vh').classList.toggle('on', !!S.haptic);
  $('cg').innerHTML = [['tilt', 'cTilt', 'cTiltS'], ['touch', 'cTouch', 'cTouchS']].map(([id, a, b]) =>
    `<button class="lang ${S.ctrl === id ? 'sel' : ''}" onclick="setCtrl('${id}')"><b>${t(a)}</b><span>${t(b)}</span></button>`).join('');
  $('lg').innerHTML = Object.keys(L).map(k =>
    `<button class="lang ${k === S.lang ? 'sel' : ''}" onclick="setLang('${k}')"><b>${L[k].n}</b><span>${k.toUpperCase()}</span></button>`).join('');
}

/* ---------- HUD ---------- */
function updateHud() {
  $('hl').textContent = level;
  $('hp').style.width = (inLevel / PER * 100) + '%';
  $('ht').textContent = inLevel + '/' + PER;
  const hc = $('hc'); hc.textContent = combo > 1 ? 'x' + combo : ''; hc.classList.toggle('hot', combo >= 4);
  $('hg').textContent = ghosts.length;
  $('hsh').classList.toggle('hide', !shield);
}
/* Skor sayacı hedefe yumuşakça akar */
function hudTick(rdt) {
  if (st === 'menu' || st === 'intro' || st === 'over') return;
  dispScore += (score - dispScore) * Math.min(1, rdt * 12);
  if (Math.abs(score - dispScore) < 1) dispScore = score;
  const v = Math.round(dispScore);
  if (v !== shownScore) { shownScore = v; $('hs').textContent = fmt(v); }
}

/* ---------- Oyun akışı: başlat, duraklat, çık ---------- */
function play(skipAd) {
  if (st === 'over' && !skipAd && realAds() && ++CG.runs >= 2 && performance.now() - CG.lastAd > 100000) { CG.runs = 0; cgAd('midgame', () => play(true)); return; }
  cgBanner(false);
  initAudio(); clearTimeout(overTimer); lockPortrait(); B = { spd: 1, life: 1, coin: 0, cw: 0, mg: 0, sc: 1, lag: 0 }; surge = chrono = 0; $('boon').classList.remove('on');
  /* eğim izni, dokunuş olayının içinde (senkron) istenmeli: o yüzden en başta */
  tiltFail = false;
  if (S.ctrl === 'tilt') startTilt().then(ok => { if (!ok && S.ctrl === 'tilt') failTilt(); });
  score = shards = inLevel = bonusCoins = nearCoins = runNear = missLv = 0; level = 1; combo = 1; comboT = 0;
  orbCd = rnd(10, 14); countT = 0; countStage = -1; earned = 0; dispScore = 0; shownScore = -1;
  shield = S.up.u2 >= 1;
  reset(); st = 'count';
  $('hud').classList.remove('off'); measure(); show(null);
  $('pb').querySelector('use').setAttribute('href', '#i-pause');
  musFilter(20000); updateHud(); $('hs').textContent = '0';
  if (S.st.games === 0 && !play.hinted) { play.hinted = true; showToast('cursor', 'b-cyan', t('h1t'), t(S.ctrl === 'tilt' ? 'cTipTilt' : 'cTipTouch')); }
}
function restart() { play(); }
function pauseT() {
  if (st === 'play' || st === 'count') {
    prevSt = st; st = 'pause'; cgPlay(false); musFilter(600);
    $('pi').textContent = `${t('lv')} ${level} · ${shards} ${t('k')} · ${fmt(score)}`;
    $('pb').querySelector('use').setAttribute('href', '#i-play');
    $('pCal').style.display = useTilt() ? '' : 'none';
    show('pause');
  } else if (st === 'pause') {
    st = prevSt; show(null); cgPlay(true); musFilter(20000); last = performance.now();
    if (useTilt()) calibrate();   /* devam ederken telefonun duruşu yeni merkez */
    $('pb').querySelector('use').setAttribute('href', '#i-pause');
  }
}
/* Menüde arkada akan gösteri: oyuncu kendi kendine dolaşır, iki yankı onu kovalar */
function demoReset() {
  level = 1; shield = false; combo = 1; comboT = 0; inLevel = 0; reset(); addGhost(); addGhost();
}
function toMenu() {
  clearTimeout(overTimer); cgPlay(false); st = 'menu'; demoReset();
  $('hud').classList.add('off'); musFilter(20000); show('menu'); menuStats();
}

/* ---------- Açılış animasyonu ---------- */
function buildIntro() {
  $('introLogo').innerHTML = 'Phantrail'.split('').map((ch, i) => `<span style="--d:${i}">${ch}</span>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => { $('loadBar').style.width = '100%'; }));
  const minWait = new Promise(r => setTimeout(r, 2300));
  const fonts = (document.fonts && document.fonts.ready)
    ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
  Promise.all([minWait, fonts]).then(() => { introReady = true; cgLoaded(); $('intro').classList.add('ready'); measure(); });
  /* harfler yerine oturdukça tuvalde ışık patlamaları */
  setTimeout(() => { ring(W / 2, H * .42, '255,176,46', 520, 1.2, 3); burst(W / 2, H * .42, '#ffd27a', 26, 300, 'st'); }, 950);
  setTimeout(() => { ring(W / 2, H * .42, '255,90,95', 760, 1.4, 2); burst(W / 2, H * .42, '#ff5a5f', 18, 260, 'ci'); }, 1500);
}
function leaveIntro() {
  if (!introReady || introDone) return;
  introDone = true; initAudio(); lockPortrait(); SFX.whoosh(); vib(15);
  $('intro').classList.add('leave');
  st = 'menu'; show('menu'); menuStats();
  ring(W / 2, H / 2, '255,200,90', 900, .9, 4); burst(W / 2, H / 2, '#ffd27a', 30, 380, 'st');
  setTimeout(() => { $('intro').style.display = 'none'; }, 900);
}

/* ---------- Giriş: işaretçi, klavye, pencere ---------- */
function aim(e) {
  usingMouse = e.pointerType === 'mouse';
  if (st !== 'play' && st !== 'count') return;
  if (useTilt()) return;   /* eğim modunda dokunuş yok sayılır (ikincil mod: Ayarlar > Kontrol) */
  tgt.x = clamp(e.clientX, 0, W);
  tgt.y = clamp(e.clientY - (e.pointerType === 'touch' ? 34 : 0), HUDB, H);
}
cv.addEventListener('pointerdown', e => { initAudio(); aim(e); try { cv.setPointerCapture(e.pointerId); } catch (err) { /* yok say */ } });
cv.addEventListener('pointermove', aim);
$('intro').addEventListener('pointerdown', () => { initAudio(); leaveIntro(); });
document.addEventListener('click', e => {
  if (e.target.closest && e.target.closest('.btn,.tile,.rbtn,.tab,.lang,.hbtn,.sw')) SFX.click();
}, true);
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if ((st === 'play' || st === 'count') && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  keys[k] = true; initAudio();
  if (e.repeat) return;
  if (!introDone) { if (k === 'Enter' || k === ' ') leaveIntro(); return; }
  if (k === 'p' || k === 'Escape') {
    if (st === 'play' || st === 'count' || st === 'pause') pauseT();
    else if (SUBS.includes(curScreen)) back();
  } else if (k === 'Enter' && st === 'menu' && curScreen === 'menu') tryPlay();
});
addEventListener('keyup', e => { delete keys[e.key.length === 1 ? e.key.toLowerCase() : e.key]; });
addEventListener('blur', () => { keys = {}; if (st === 'play') pauseT(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && st === 'play') pauseT();
  if (ac) { if (document.hidden) ac.suspend(); else ac.resume(); }
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
function refreshScreen() {
  if (curScreen === 'shop') renderShop();
}
function onResize() { if (rotGuard()) return; resize(); buildRVig(); setTimeout(measure, 60); refreshScreen(); }
addEventListener('resize', onResize);
document.addEventListener('visibilitychange', () => { if (document.hidden && (st === 'play' || st === 'count')) pauseT(); });
addEventListener('orientationchange', () => setTimeout(onResize, 200));

/* ---------- Ana döngü ---------- */
function loop(now) {
  requestAnimationFrame(loop);
  const rdt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; frame++;
  try {
    update(rdt); draw(); hudTick(rdt);
    if (frame % 2 === 0) drawPreviews();
  } catch (err) { console.error(err); }
}

/* ---------- Başlangıç ---------- */
loadSave(); S.xp = S.xp || 0;
applyLang(); cgInit();
onResize();
setMap();
demoReset();
menuStats();
buildIntro();
last = performance.now();
requestAnimationFrame(loop);

</script>
</body>
</html>
